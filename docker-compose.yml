services:
  database:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: nexora_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexora_rag"]
      interval: 5s
      timeout: 3s
      retries: 10

  tika:
    image: apache/tika:4.1.0
    ports:
      - "127.0.0.1:9998:9998"

volumes:
  postgres_data:
