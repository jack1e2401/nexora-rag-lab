[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nexora-rag-lab"
version = "0.1.0"
description = "A small RAG experiment lab for the Nexora benchmark"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pgvector>=0.4,<1",
    "pydantic>=2.8,<3",
    "python-multipart>=0.0.20,<1",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1,<2",
    "sentence-transformers>=6.2,<7",
    "transformers>=5,<6",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
